mutation CreateUser
@auth(
  level: USER
  insecureReason: "This operation is intentionally exposed to any user for demo purposes."
) {
  user_insert(
    data: {
      displayName: "New User"
      createdAt_expr: "request.time"
      id_expr: "uuidV4()"
    }
  )
}

query GetNotes
@auth(
  level: USER
  insecureReason: "This operation is intentionally exposed to any user for demo purposes."
) {
  notes {
    id
    title
    content
  }
}

mutation UpdateNote($id: UUID!, $content: String!)
@auth(
  level: USER
  insecureReason: "This operation is intentionally exposed to any user for demo purposes."
) {
  note_update(
    id: $id
    data: { content: $content, updatedAt_expr: "request.time" }
  )
}

query ListPublicCategories
@auth(
  level: PUBLIC
  insecureReason: "This operation is safe to expose to the public"
) {
  categories {
    id
    name
    description
  }
}
